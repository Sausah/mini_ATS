[project]
name = "mini-ats"
version = "0.1.0"
description = "Mini ATS"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.0.7",
    "Flask-CORS>=4.0.1",
    "marshmallow>=3.21.3",
    "marshmallow-sqlalchemy>=1.1.0",
    "python-dotenv>=1.0.1",
    "SQLAlchemy>=2.0.31",
    "email-validator>=2.2.0",
    "itsdangerous>=2.1.2",
    "gunicorn>=22.0.0",
]

[tool.vercel]
entrypoint = "backend.run:app"
